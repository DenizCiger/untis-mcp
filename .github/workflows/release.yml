name: Release

# Pushing a tag like v0.1.0 builds binaries and publishes a GitHub release.
# Running the workflow manually only builds them (uploaded as run artifacts).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CRATE_VERSION)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        id: package
        shell: bash
        run: |
          BIN=untis-mcp
          [ "${{ runner.os }}" = "Windows" ] && BIN=untis-mcp.exe
          ARCHIVE="untis-mcp-${{ matrix.target }}.${{ matrix.archive }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN" README.md LICENSE dist/
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C dist -czf "$ARCHIVE" "$BIN" README.md LICENSE
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            cd dist
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$BIN','README.md','LICENSE' -DestinationPath '../$ARCHIVE' -Force"
            cd ..
            powershell.exe -NoProfile -Command "(Get-FileHash '$ARCHIVE' -Algorithm SHA256).Hash.ToLower() + '  $ARCHIVE'" > "$ARCHIVE.sha256"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: untis-mcp-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          generate_release_notes: true
