[package]
name = "untis-mcp"
version = "0.1.0"
description = "MCP server for WebUntis timetables, changes, free rooms and absences"
license = "MIT"
repository = "https://github.com/DenizCiger/untis-mcp"
readme = "README.md"
keywords = ["mcp", "webuntis", "untis", "timetable", "ai"]
categories = ["command-line-utilities"]
rust-version = "1.89"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
